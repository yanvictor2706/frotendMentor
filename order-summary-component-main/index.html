<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>
<main class="cartao">
    <link rel="stylesheet" href="css/style.css">
   
    <img src="images/illustration-hero.svg" alt="Pessoa ouvindo música" class="imagem-topo">

    <div class="conteudo">
      <h1>Order Summary</h1>
      <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

      
      <div class="caixa-plano">
        
        
        <img src="images/icon-music.svg" alt="Ícone de música" class="icone">
        
        <div class="texto-plano">
          <strong id="nome-plano">Annual Plan</strong>
          <span id="preco-plano">$59.99/year</span>
        </div>

        <button id="btn-trocar" class="link-trocar">Change</button>
      </div>

     
      <button id="btn-pagar" class="botao-roxo">Proceed to Payment</button>
      <button id="btn-cancelar" class="botao-cancelar">Cancel Order</button>
    </div>

  </main>
 
</body>
</html>
